name: build-apk

# NoteSync BJ（cn.xuyinji.bj）APK 云构建。本机零 Android 依赖。
#
# 🔴 发版铁律：**单测不绿就不出包**。
#   老项目栽过：CI 只编译签名出包、不跑任何测试，"四层测试闸"全靠本地手动执行，
#   手滑或换机就能把红版推到手机上。
#   现在 test 作业不绿 → build 作业不执行 → 不出包、不打 Release。
#
# 🔴 e2e 为什么不在 CI：它需要真浏览器（Playwright 装 Chromium 约 300MB）
#   且要起本地 HTTP 服务，CI 上慢且脆。e2e 留在本地闸内跑
#   （npm run test:e2e 与 npm run test:e2e:live），推 tag 前必须已绿。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 需要
  actions: read

jobs:
  test:
    name: 单元测试闸
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        # 🔴 --ignore-scripts：跳过 playwright 的浏览器下载（单测只要 jsdom 那层，
        #   e2e 不在 CI 跑）。不省这一步每次 CI 多下 300MB。
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: 类型检查
        run: npm run typecheck

      - name: 全量单元测试（真源层 + 客户端 + 服务端 + MCP）
        # 任一红 → 本作业失败 → build 不执行 → 不出包
        run: npm test

      - name: 时区无关性（本地绿 ≠ 到处绿）
        # 🔴🔴 本项目第一条 CI 抓出来的红：F2 fmtRemTime。
        #   断言写死了 `ISO(+08:00) → '10:00'`，而实现用的是 getHours 等**本地时区**
        #   getter（这是对的设计：用户看到的提醒就该是用户所在时区的钟点）。
        #   ⇒ 那条断言只在 GMT+8 成立 —— 开发者本机长期全绿，CI runner 是 UTC 就红。
        #   本地永远抓不到这类问题（本机时区 = 写断言的人的时区），
        #   所以这里显式在两个**非本机**时区下各跑一遍客户端单测。
        #   断言时区无关是修法；把这件事钉进CI 才是防复发的部分。
        run: |
          for tz in UTC America/New_York Pacific/Auckland; do
            echo "--- TZ=$tz ---"
            # 🔴 直接调 runner 自带的 node，不走 npx：npx node 会去 registry 找
            #   "node" 这个包（本地并没有这个依赖），装不上或行为不确定。
            TZ=$tz node --test packages/client/test/*.test.mjs \
              || { echo "🔴 客户端单测在 TZ=$tz 下失败 —— 存在写死时区的断言"; exit 1; }
          done

      - name: 构建（顺带验证 esbuild 产物能出）
        run: npm run build

  build:
    name: 构建并签名 APK
    needs: test
    runs-on: ubuntu-latest
    # 🔴 ver 供下游 deploy 作业取用（artifact 名、APK 版本号、OTA tag 三处同一值）。
    #   三处若取到不同的值，就会出现"APK 自报 1.13.1、OTA 却指向 1.13.2 的包"。
    outputs:
      ver: ${{ steps.ver.outputs.ver }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 解析版本号
        id: ver
        # 🔴 tag 推送用 tag 名；手动触发（workflow_dispatch）没有 tag，
        #   退回到 package.json —— 版本号唯一真源，与 E2E-01 那条判据同源。
        #   🔴 不加这个 fallback 的话，手动触发时 GITHUB_REF_NAME 是分支名
        #   （"main"），APK 会自报 versionName "main"，OTA 也会把 json 写成
        #   tag_name "vmain" —— 版本号是单调的，一旦污染就得再发一版才盖得掉。
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VER="$GITHUB_REF_NAME"
          else
            VER="v$(node -p "require('./package.json').version")"
          fi
          echo "版本 = $VER"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"

      - name: Setup JDK 21
        # Capacitor 7 硬要求：capacitor-android 源级别 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: 构建前端并同步进壳
        # 🔴 顺序不能颠倒：先 build 出 www/，再 cap sync 把 www/ 拷进
        #   android/app/src/main/assets/public。颠倒的话同步的是上一份（或没有）。
        # 🔴 app.js 是单文件（CSS inline 进 index.html），所以 assets 里
        #   index.html + app.js 必须是**同一版** —— 拆开发就会半夜白屏。
        run: |
          npm run build
          npx cap sync android
          # 🔴 物化自检：assets 少一个文件，APK 能装能开但对应功能静默失灵
          #   （老项目栽过：sw.js / html2canvas.min.js 漏进包，
          #   离线能力与导出长图整体不可用，而构建日志一片绿）。
          ls -l android/app/src/main/assets/public/
          for f in index.html app.js sw.js html2canvas.min.js jsQR.js qrcode-generator.js; do
            test -s "android/app/src/main/assets/public/$f" \
              || { echo "❌ 缺必需静态资源 $f（对应功能在 App 内直接不可用）"; exit 1; }
          done

      - name: 从 tag 注入安卓版本号
        run: |
          VER="${{ steps.ver.outputs.ver }}"
          VER="${VER#v}"
          # 🔴 versionName 必须等于 tag 去掉 v —— 老项目 v5.55 出的 APK 自报 5.54，
          #   用户看到"已经是最新版"却拿到旧版逻辑，是这一条漏改造成的。
          # 🔴🔴 versionCode 必须用**加权单调算法**，绝不能"去点拼接"（tr -d '.'）：
          #   拼接在位数变化时倒退 —— 1.13.1→1131、2.0.0→**200**，Android 覆盖安装
          #   只判 versionCode ⇒ 从 1.13.1 升 2.0.0 被系统拒绝（2026-10-08 用户实测
          #   报障实锤，线上 v2.0.0 APK AXML 解析 versionCode=200 验证）。
          #   加权算法 major*10000+minor*100+patch：2.0.1→20001 > 一切历史拼接值，
          #   2.1.0→20100、3.0.0→30000 单调递增，永不再倒退。
          IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH <<< "$VER"
          CODE=$((VER_MAJOR * 10000 + VER_MINOR * 100 + VER_PATCH))
          sed -i "s/versionCode [0-9]\+/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"$VER\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: 解码签名密钥库
        env:
          B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$B64" | base64 -d > android/notesync-release.p12
          test -s android/notesync-release.p12 || { echo "❌ 密钥库解码为空（secret 配错？）"; exit 1; }

      - name: 构建 release APK
        working-directory: android
        run: |
          chmod +x gradlew   # 兜底：Windows 提交可能丢可执行位
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/notesync-release.p12 \
            -Pandroid.injected.signing.store.password=${{ secrets.ANDROID_KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.ANDROID_KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.ANDROID_KEY_PASSWORD }} \
            --no-daemon

      - name: 上传 APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NoteSyncBJ-${{ steps.ver.outputs.ver }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30


  # ─────────────────────────────────────────────────────────────────────
  # 云构建出包之后**自动**同步到腾讯云服务器，闭环 OTA。
  #
  # 🔴 为什么必须自动：出包与上传分两步人肉做时，"APK 已传但 latest_app.json 没落"
  #   或反过来，都会在窗口期里让全网手机点更新失败（404 或拿到旧包）。
  #   而这两步的失败在本地都看不出来 —— 只有真去点一次"检查更新"才知道。
  #
  # 🔴 上传顺序的硬纪律在 tools/push_bj_apk.py 里（倒装：两个 APK 先就位，
  #   latest_app.json 最后落），这里**不重写那段逻辑** —— 直接调那个脚本，
  #   让它做唯一权威。重复实现一份 = 两份都会漂移。
  # ─────────────────────────────────────────────────────────────────────
  deploy:
    name: 发布 APK（腾讯云 OTA + GitHub Releases）
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: 落地 SSH 私钥
        # 🔴 路径被 push_bj_apk.py 写死为 ~/.ssh/notesync_deploy，不能另选。
        #   chmod 600 是硬要求：OpenSSH 见权限太开直接拒绝用这把钥匙，
        #   报的错是 "UNPROTECTED PRIVATE KEY FILE" 而不是"连不上"，容易误判。
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s' "${{ secrets.BJ_SSH_KEY }}" > ~/.ssh/notesync_deploy
          chmod 600 ~/.ssh/notesync_deploy
          # 私钥末尾换行：secret 若被存成不带尾换行，OpenSSH 仍能读，
          # 但多一行空行会导致 "invalid format" —— 统一去掉尾部空白再补一个换行。
          printf '\n' >> ~/.ssh/notesync_deploy
          ssh-keygen -y -f ~/.ssh/notesync_deploy > /dev/null \
            && echo "私钥可解析" || { echo "❌ 私钥不可用（secret BJ_SSH_KEY 内容不对？）"; exit 1; }

      - name: 取回上一作业出好的 APK
        uses: actions/download-artifact@v4
        with:
          name: NoteSyncBJ-${{ needs.build.outputs.ver }}.apk
          path: _apk

      - name: 放到 push 脚本期望的路径
        run: |
          mkdir -p android/app/build/outputs/apk/release
          cp _apk/app-release.apk android/app/build/outputs/apk/release/app-release.apk
          ls -l android/app/build/outputs/apk/release/app-release.apk
          # 🔴 空包必须在这里拦掉：push_bj_apk.py 只比大小，0 字节会一路"上传成功"
          #   然后把一个坏包推给全网。
          test -s android/app/build/outputs/apk/release/app-release.apk \
            || { echo "❌ 取回的 APK 是空的"; exit 1; }

      - name: 上传 APK + 落 OTA 元数据 + 线上校验
        # 脚本内部会断言：远端两处大小一致、/api/latest 的 URL 指向本版、
        # assets[0].name 以 .apk 结尾（客户端 pickApk 只认这个）、
        # /dl/vX.Y.Z.apk 与 /dl/latest.apk 都 HEAD 200。任一不满足即非零退出。
        run: python3 tools/push_bj_apk.py "${{ needs.build.outputs.ver }}"

      - name: 发布 GitHub Release
        # 🔴🔴 这一步原来挂在 build 作业末尾且带 `if: startsWith(github.ref,'refs/tags/')`
        #   ⇒ **手动触发时整步被跳过**：腾讯云已经更新，GitHub Releases 还停在上一版，
        #   两处不一致，从 Release 页下载的仍是旧包（v1.13.1 就是这么漏掉的）。
        #   现在挪到本作业**最后**：上传腾讯云成功并校验通过之后才发 GitHub，
        #   ⇒ 两处**同进同退**，不会出现"一处新一处旧"。
        # 🔴 tag_name 必须显式给：不指定的话 action 会拿 git ref 猜，手动触发时那是
        #   分支名 "main" ⇒ 凭空多出一个叫 main 的 Release（版本号单调，污染了要再发一版才盖得掉）。
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.build.outputs.ver }}
          name: ${{ needs.build.outputs.ver }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: android/app/build/outputs/apk/release/app-release.apk
